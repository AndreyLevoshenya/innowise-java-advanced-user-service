name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-analyze-docker:
    name: Build, Test, Analyze and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build application
        run: ./gradlew assemble --no-daemon

      - name: Run tests
        run: ./gradlew test jacocoTestReport --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: |
            build/reports/tests/test/
            build/reports/jacoco/test/
          if-no-files-found: ignore
          retention-days: 7

      - name: SonarQube analysis
        if: success()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          ./gradlew sonar --no-daemon \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.host.url="https://sonarcloud.io" \
            -Dsonar.token="$SONAR_TOKEN"

      - name: Build Docker image with Compose
        if: success()
        env:
          USER_SERVICE_DB_NAME: ${{ vars.USER_SERVICE_DB_NAME }}
          USER_SERVICE_DB_USER: ${{ vars.USER_SERVICE_DB_USER }}
          USER_SERVICE_DB_PORT: ${{ vars.USER_SERVICE_DB_PORT }}
          USER_SERVICE_REDIS_PORT: ${{ vars.USER_SERVICE_REDIS_PORT }}
          USER_SERVICE_PORT: ${{ vars.USER_SERVICE_PORT }}
          USER_SERVICE_DB_PASSWORD: ${{ secrets.USER_SERVICE_DB_PASSWORD }}
          USER_SERVICE_REDIS_PASSWORD: ${{ secrets.USER_SERVICE_REDIS_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose build user-service

      - name: Save Docker image
        if: success()
        run: docker save user-service:${GITHUB_SHA} -o user-service.tar

      - name: Upload Docker image artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: user-service-docker-image
          path: user-service.tar
          retention-days: 7